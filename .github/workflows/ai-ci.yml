name: AI Agent CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'agent ai/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'agent ai/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: './agent ai'

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
        
    - name: Install dependencies
      run: uv sync --all-extras --dev
      
    - name: Run linting (ruff)
      run: uv run ruff check .
      
    - name: Run tests
      run: uv run pytest
